<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Earth with factory emissions and trees">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfeaf7"/>
      <stop offset="1" stop-color="#eaf7ee"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="680" cy="110" r="50" fill="#ffd966"/>

  <!-- Earth -->
  <circle cx="400" cy="300" r="170" fill="#4aa3c8"/>
  <path d="M310 220 C340 190 390 195 400 225 C410 255 370 270 355 295 C335 320 300 300 295 265 C292 245 298 232 310 220 Z" fill="#2e7d4f"/>
  <path d="M430 310 C465 290 505 305 500 345 C495 385 450 400 430 380 C415 362 415 325 430 310 Z" fill="#2e7d4f"/>
  <path d="M385 400 C400 390 420 400 415 420 C410 440 385 440 380 420 C378 412 380 405 385 400 Z" fill="#2e7d4f"/>

  <!-- ground -->
  <rect y="500" width="800" height="100" fill="#8fd19e"/>

  <!-- factory -->
  <rect x="80" y="400" width="150" height="100" fill="#6b6f76"/>
  <rect x="100" y="340" width="30" height="60" fill="#55595f"/>
  <rect x="160" y="360" width="30" height="40" fill="#55595f"/>
  <rect x="100" y="430" width="22" height="26" fill="#d9e6ee"/>
  <rect x="140" y="430" width="22" height="26" fill="#d9e6ee"/>
  <rect x="180" y="430" width="22" height="26" fill="#d9e6ee"/>
  <!-- smoke -->
  <g fill="#9aa0a6" opacity="0.85">
    <circle cx="115" cy="320" r="18"/>
    <circle cx="135" cy="290" r="24"/>
    <circle cx="165" cy="262" r="30"/>
    <circle cx="205" cy="240" r="34"/>
  </g>
  <text x="200" y="246" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">CO₂</text>

  <!-- trees -->
  <g>
    <rect x="590" y="450" width="14" height="50" fill="#8a5a2b"/>
    <circle cx="597" cy="440" r="38" fill="#2e7d4f"/>
    <rect x="660" y="465" width="12" height="35" fill="#8a5a2b"/>
    <circle cx="666" cy="455" r="30" fill="#3a9560"/>
    <rect x="720" y="470" width="10" height="30" fill="#8a5a2b"/>
    <circle cx="725" cy="462" r="26" fill="#2e7d4f"/>
  </g>

  <!-- footprints -->
  <g fill="#2e7d4f">
    <ellipse cx="400" cy="548" rx="20" ry="28"/>
    <circle cx="388" cy="508" r="7"/>
    <circle cx="402" cy="504" r="7"/>
    <circle cx="416" cy="508" r="6"/>
    <ellipse cx="470" cy="560" rx="18" ry="25" opacity="0.6"/>
  </g>

  <text x="400" y="50" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#1f5c39" text-anchor="middle">Protect our planet</text>
</svg>
