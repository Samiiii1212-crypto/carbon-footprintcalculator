<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" role="img" aria-label="Footprint with leaf and Earth">
  <rect width="600" height="450" fill="#e8f5ec"/>
  <circle cx="300" cy="225" r="170" fill="#bfe3cc"/>
  <!-- foot sole -->
  <path d="M255 190 C225 210 215 290 240 345 C255 380 305 385 325 355 C350 315 345 240 320 200 C305 175 275 175 255 190 Z" fill="#2e7d4f"/>
  <!-- toes -->
  <ellipse cx="262" cy="150" rx="20" ry="26" fill="#2e7d4f"/>
  <ellipse cx="308" cy="140" rx="17" ry="23" fill="#2e7d4f"/>
  <ellipse cx="343" cy="152" rx="14" ry="20" fill="#2e7d4f"/>
  <ellipse cx="370" cy="172" rx="12" ry="17" fill="#2e7d4f"/>
  <ellipse cx="226" cy="178" rx="13" ry="18" fill="#2e7d4f"/>
  <!-- leaf -->
  <path d="M285 330 C285 270 320 235 365 225 C365 275 335 320 285 330 Z" fill="#8fd19e"/>
  <path d="M290 325 C310 290 335 262 360 235" stroke="#2e7d4f" stroke-width="4" fill="none"/>
  <!-- CO2 clouds -->
  <g fill="#ffffff" stroke="#9db8a6" stroke-width="2">
    <ellipse cx="120" cy="90" rx="55" ry="28"/>
    <ellipse cx="480" cy="80" rx="60" ry="30"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#4b5d52" text-anchor="middle">
    <text x="120" y="98">CO₂</text>
    <text x="480" y="88">CO₂</text>
  </g>
  <text x="300" y="425" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2e7d4f" text-anchor="middle">Reduce your footprint</text>
</svg>
